            { id: "UCwR6z7fsMpHPjypxQxMYAjw", name: "『BLEACH』アニメ公式チャンネル" },
            { id: "UCxL_Vlnhfo46sN6vPHR_4hA", name: "夢限大みゅーたいぷ" },
            { id: "UCxbkConJdaFjgwKXv4POaeA", name: "でんおこ DEN_OKO【ゲーム実況&アニメ・マンガ解説】" },
            { id: "UCxjDkUwVlBILmkwOzQKTkmw", name: "ワールドトリガー アニメ公式" },
            { id: "UCyuEAZQzRqhcaLZvQd9ZUNA", name: "CapcomChannel" },
          ];

          // ───────────── 配置 ─────────────
          const FEED_TEMPLATE =
            process.env.FEED_TEMPLATE || 'https://www.youtube.com/feeds/videos.xml?channel_id={id}';
